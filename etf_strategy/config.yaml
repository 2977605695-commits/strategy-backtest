# ============================================================
# V10 Adaptive Trend Rotation — 生产配置
# ============================================================
# 用法: 修改本文件即可切换回测/模拟/实盘模式，无需改代码
# ============================================================

# ── 运行模式 ────────────────────────────────────────
mode: paper                    # paper(模拟) | live(实盘) | backtest(回测)
platform: qmt                  # qmt | ptrade

# ── 资金与账户 ──────────────────────────────────────
account:
  initial_capital: 10000000    # 初始资金（回测用）
  max_position_ratio: 1.0      # 最大仓位比例（1.0=满仓）

# ── 策略参数 ──────────────────────────────────────
strategy:
  fast_ma: 6                   # 快线 MA 周期
  slow_ma: 15                  # 慢线 MA 周期
  slope_ma: 8                  # 斜率 MA 周期
  trail_bull: 0.03             # 牛市 trail 止损比例
  trail_bear: 0.06             # 熊市 trail 止损比例
  bull_min_hold: 0             # 牛市最小持仓天数
  bear_min_hold: 7             # 熊市最小持仓天数
  pullback_min: 0.05           # 最小回调幅度（避免追高）
  need_n_index: 7              # 切回全池所需的指数 slope 正向数
  pnl_loss_threshold: -1000000 # 连续 5 笔亏损超此值切防御池
  risk_free: 0.025             # 无风险利率

# ── 标的池 ──────────────────────────────────────
pool:
  full:                         # 全池（牛市用）
    - "159782"   # 科创50ETF
    - "588380"   # 科创100ETF
    - "588870"   # 科创200ETF
    - "588080"   # 科创50ETF易方达
    - "588300"   # 科创芯片ETF
    - "518800"   # 黄金ETF
    - "589720"   # 半导体设备ETF
    - "588890"   # 科创AIETF
    - "588170"   # 科创半导体ETF
    - "588200"   # 科创芯片ETF
    - "159995"   # 芯片ETF
    - "512480"   # 半导体ETF
    - "515880"   # 通信ETF
    - "515050"   # 5G通信ETF
    - "159819"   # 人工智能ETF
    - "159992"   # 创新药ETF
    - "512010"   # 医药ETF
    - "518880"   # 华安黄金ETF
    - "159937"   # 博时黄金ETF
    - "513180"   # 恒生科技ETF
    - "513050"   # 中概互联ETF
    - "513100"   # 纳指ETF
    - "159509"   # 纳指科技ETF
    - "588000"   # 华夏科创50ETF
    - "588220"   # 科创100ETF
    - "510300"   # 沪深300ETF
    - "159915"   # 创业板ETF
    - "510050"   # 上证50ETF
    - "511010"   # 国债ETF
    - "511260"   # 十年国债ETF
    - "510880"   # 红利ETF
    - "512890"   # 红利低波ETF
    - "159201"   # 自由现金流ETF华夏
  defensive:                    # 防御池（熊市用）
    - "518880"   # 华安黄金
    - "159937"   # 博时黄金
    - "518800"   # 黄金ETF
    - "511010"   # 国债ETF
    - "511260"   # 十年国债ETF
    - "510880"   # 红利ETF
    - "512890"   # 红利低波ETF
    - "159201"   # 自由现金流ETF华夏
    - "510050"   # 上证50ETF
  index_codes:                  # 指数 slope 监测标的
    "510300": "HS300"
    "159915": "创业板"
    "588000": "科创50"
    "510050": "上证50"
    "515880": "通信ETF"
    "512480": "半导体ETF"
    "513100": "纳指ETF"
    "511260": "十年国债"
    "512890": "红利低波"
    "159992": "创新药ETF"

# ── 风控参数 ──────────────────────────────────────
risk:
  stop_loss_ratio: 0.08        # 单笔最大亏损（-8%）
  take_profit_ratio: 0.30      # 单笔止盈（+30%）
  max_positions: 1             # 最大同时持仓数
  max_order_amount: 20000000   # 单笔最大下单金额（元）
  max_daily_trades: 20         # 日内最大交易次数
  max_cancel_reissue: 3        # 最大撤单重发次数
  max_slippage: 0.005          # 最大可接受滑点（0.5%）
  circuit_breaker_loss: 0.15   # 熔断：单日累计亏损超 15% 停止
  position_sync_interval: 300  # 持仓对账间隔（秒）

# ── 交易执行参数 ──────────────────────────────────
execution:
  slippage: 0.003              # 预估滑点 0.3%
  buy_fee: 0.00025             # 买入佣金
  sell_fee: 0.00025            # 卖出佣金
  stamp_tax: 0.0005            # 印花税（仅卖出）
  min_order_amount: 10000      # 最小下单金额
  order_timeout: 60            # 订单超时（秒）
  cancel_wait: 5               # 撤单后等待（秒）

# ── 日志配置 ──────────────────────────────────────
logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  log_dir: logs                # 日志目录
  max_days: 90                 # 日志保留天数
  console: true                # 是否输出到控制台

# ── 数据源配置 ─────────────────────────────────────
data:
  source: local                # local | akshare | platform
  data_dir: ../data            # 本地数据目录
  start_date: "2020-01-01"
  end_date: "2026-07-31"