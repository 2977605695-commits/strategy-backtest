# ============================================================
# V10 Adaptive Trend Rotation — 生产配置
# ============================================================
# 用法: 修改本文件即可切换回测/模拟/实盘模式，无需改代码
# ============================================================

# ── 运行模式 ────────────────────────────────────────
mode: paper                    # paper(模拟) | live(实盘) | backtest(回测)
platform: qmt                  # qmt | ptrade

# ── 资金与账户 ──────────────────────────────────────
account:
  initial_capital: 10000000    # 初始资金（回测用）
  max_position_ratio: 1.0      # 最大仓位比例（1.0=满仓）

# ── 策略参数（终极版 V10 Ultimate）──────────────────
strategy:
  # ★ MA区间均值（消除尖峰）
  fast_range: [4, 5, 6]         # 快线 = MA4-6均值
  slow_range: [14, 15, 16]      # 慢线 = MA14-16均值
  # ★ MA动能投票（消除MA8尖峰）
  vote_ma: [7, 8, 9]            # 三周期投票，2/3多数同意
  slope_lookback: 4             # 斜率回看窗口
  # ★ 年线过滤（MA95，33+89池验证最优）
  ma_filter: 95                 # 替代MA60
  # ★ ATR自适应Trail（替代固定3%/6%）
  atr_mult: 2.5                 # Trail = 2.5 × ATR / peak
  atr_window: 14                # ATR计算周期
  atr_min: 0.02                 # Trail下限2%
  atr_max: 0.08                 # Trail上限8%
  # ★ B版百分比池切换（替代固定100万）
  loss_pct: 0.08                # 5笔累计亏损>净值8%切防御池
  cooldown_days: 3              # 切换冷却期（防翻烧饼）
  need_n_index: 7               # 切回全池: 7/10指数斜率正
  # 已删除参数（保留兼容）
  pullback_min: 0.0             # 已删除（蒙特卡洛验证）
  bear_min_hold: 0              # 已删除（蒙特卡洛验证）
  bull_min_hold: 0
  risk_free: 0.025              # 无风险利率
  # 兼容旧版（废弃，不再使用）
  fast_ma: 5
  slow_ma: 15
  slope_ma: 8
  trail_bull: 0.03
  trail_bear: 0.06

