# ── 风控参数 ──────────────────────────────────────
risk:
  stop_loss_ratio: 0.08        # 单笔最大亏损（-8%）
  take_profit_ratio: 0.30      # 单笔止盈（+30%）
  max_positions: 1             # 最大同时持仓数
  max_order_amount: 20000000   # 单笔最大下单金额（元）
  max_daily_trades: 20         # 日内最大交易次数
  max_cancel_reissue: 3        # 最大撤单重发次数
  max_slippage: 0.005          # 最大可接受滑点（0.5%）
  circuit_breaker_loss: 0.15   # 熔断：单日累计亏损超 15% 停止
  position_sync_interval: 300  # 持仓对账间隔（秒）

# ── 交易执行参数 ──────────────────────────────────
execution:
  slippage: 0.0003             # 预估滑点 0.03%（真实ETF费率，原0.3%偏高）
  buy_fee: 0.00025             # 买入佣金
  sell_fee: 0.00025            # 卖出佣金
  stamp_tax: 0.0               # 印花税（ETF免征，原0.05%错误）
  min_order_amount: 10000      # 最小下单金额
  order_timeout: 60            # 订单超时（秒）
  cancel_wait: 5               # 撤单后等待（秒）

# ── 日志配置 ──────────────────────────────────────
logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  log_dir: logs                # 日志目录
  max_days: 90                 # 日志保留天数
  console: true                # 是否输出到控制台

# ── 数据源配置 ─────────────────────────────────────
data:
  source: local                # local | akshare | platform
  data_dir: ../data            # 本地数据目录
  start_date: "2020-01-01"
  end_date: "2026-07-31"